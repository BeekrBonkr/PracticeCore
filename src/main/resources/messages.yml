# PracticeCore messages
#
# Every piece of text the plugin shows a player lives here. Formatting is
# MiniMessage (https://docs.advntr.dev/minimessage/format.html), so colors,
# gradients, hover and click are all available.
#
# - <prefix> inserts the prefix defined below.
# - Values in <angle.brackets> listed above each entry are its placeholders.
#   Player-supplied text is inserted literally and can never inject formatting.
# - Set a message to '' to silence it entirely.
# - A message may be a single line or a list of lines.
#
# Do not edit config-version by hand; PracticeCore uses it to migrate this file
# across upgrades (backups land in backups/).
config-version: 9

prefix: '<gold>Practice <dark_gray>» '

general:
  players-only: '<prefix><red>That has to be run in-game.'
  # <usage> — always "/practice sub <required> [optional]"; never prose (style guide R14).
  usage: '<prefix><red>Usage: <white><usage>'

permission:
  use: '<prefix><red>You may not use practice arenas.'
  menu: '<prefix><red>You may not open the practice menu.'
  leaderboard: '<prefix><red>You may not view leaderboards.'
  spectate: '<prefix><red>You may not spectate practice sessions.'
  stats-other: '<prefix><red>You may not view other players'' stats.'
  setup: '<prefix><red>You may not configure arenas.'
  arena-admin: '<prefix><red>You may not administer arenas.'
  pb-reset: '<prefix><red>You may not wipe personal bests.'
  item: '<prefix><red>You may not give out the practice menu item.'
  reload: '<prefix><red>You may not reload PracticeCore.'
  world: '<prefix><red>You may not manage the practice world.'

session:
  ready: '<prefix><green>Arena ready — the timer starts when you move. Good luck!'
  # <arena>
  switched: '<prefix><green>Switched to <white><arena><green>.'
  ended: '<prefix><gray>Practice session ended.'
  not-practicing: '<prefix><red>You are not practicing.'
  preparing: '<prefix><red>Your arena is still being prepared — one moment.'
  # Action bar the moment a join starts — big maps take a second or two to
  # paste, and silence after the command reads as lag. <arena>
  building: '<gray>Building <white><arena></white><gray>…'
  # Action bar when the arena is built and the teleport is on its way.
  teleporting: '<gray>Arena ready — teleporting you in…'
  # Title covering the whole join — the paste and the teleport after it. It
  # appears only if the join is still running after effects.title-delay-ticks
  # (so an instant join flashes nothing) and comes down when the player is
  # standing in the arena, so a slow paste never looks like a frozen client.
  # Blank both lines to switch it off. <arena>
  building-title: '<yellow><bold>Loading'
  building-subtitle: '<gray>Building <white><arena><gray>…'
  setup-in-progress: '<prefix><red>Finish or cancel arena setup first.'
  teleport-failed: '<prefix><red>Could not send you to the arena.'
  state-restored: '<prefix><gray>Your pre-practice state was restored.'
  # Shown when a switch or join fails after the previous session already ended.
  restored-after-failure: '<prefix><red>That arena could not be opened, so you were returned to where you started.'

run:
  # <time>
  finished-pb: '<prefix><green>Finished in <white><time><green> — new personal best!'
  # <time> <best>
  finished: '<prefix><gray>Finished in <white><time><gray> (best <white><best><gray>)'
  # <time>
  finished-first: '<prefix><gray>Finished in <white><time>'
  failed: '<prefix><gray>You fell! Resetting…'
  restarted: '<prefix><gray>Run restarted.'
  timer-not-started: '<yellow>The timer has not started yet'
  title:
    # <time>
    pb: '<gold><time>'
    normal: '<yellow><time>'
  subtitle:
    pb: '<green>New personal best!'
    # <delta>
    behind: '<gray>+<delta> off your best'
    first: '<gray>Run complete'
  # <player> <arena> <time> <previous-holder> <delta>
  record-broadcast: '<prefix><gold><player> <gray>set a new record on <white><arena> <dark_gray>— <yellow><time>'
  record-broadcast-beaten: '<prefix><gold><player> <gray>set a new record on <white><arena> <dark_gray>— <yellow><time> <dark_gray>(beat <previous-holder> by <delta>)'
  # Quieter than the record shout — an improved personal best, not a takeover.
  # <player> <arena> <time> <improvement>
  pb-broadcast: '<prefix><gray><player> beat their personal best on <white><arena> <dark_gray>— <gray><time> (-<improvement>)'

build:
  out-of-bounds: '<red>Out of bounds'
  break-own-only: '<red>You can only break blocks you placed'

mlg:
  # Shown when the bucket is used while still standing on the platform.
  jump-first: '<red>Clutch on the way down, not before'
  # <streak>
  success: '<prefix><green>MLG! <gray>Streak: <white><streak>'
  # <streak> — the clutch that beat your highest streak ever
  success-best: '<prefix><green>MLG! <gray>Streak: <white><streak> <gold>— new best!'

# Spectator mode: /practice spectate, the main menu's Spectate button, and
# the three hotbar tools every spectator carries.
spectate:
  # <target> <arena>
  started: '<prefix><gray>Now spectating <white><target> <gray>on <white><arena><gray>. Fly freely — the bed brings you back.'
  stopped: '<prefix><gray>Stopped spectating — welcome back.'
  # The spectator was pulled out by an external teleport (/spawn, /tpa, …).
  ended: '<prefix><gray>Spectating ended.'
  # The watched player's session ended (they left, finished for good, or quit).
  target-left: '<prefix><gray>The player you were watching stopped practicing.'
  # <player>
  target-not-practicing: '<prefix><red><player> is not practicing right now.'
  not-spectating: '<prefix><red>You are not spectating anyone.'
  # Spectating is switched off server-wide (spectate.enabled in config.yml).
  disabled: '<prefix><red>Spectating is disabled on this server.'
  # Another plugin cancelled the teleport into the practice world.
  entry-blocked: '<prefix><red>Something blocked your way into the practice world — tell an admin.'
  self: '<prefix><red>You cannot spectate yourself.'
  # <player>
  unknown-player: '<prefix><red>No online player named <white><player><red>.'
  # Sent to the watched player. <player>
  watcher-joined: '<prefix><gray><player> is now spectating you.'
  # <player>
  watcher-left: '<prefix><gray><player> stopped spectating you.'
  # Action bar when a spectator drifts too far and is pulled back.
  leash: '<gray>Pulled back to the arena you are spectating'
  item:
    teleport:
      # <target>
      name: '<aqua><bold>Teleport to <target>'
      lore:
        - '<gray>Right-click to snap back'
        - '<gray>to the player you watch.'
    menu:
      name: '<white><bold>Switch Player'
      lore:
        - '<gray>Right-click to pick another'
        - '<gray>player to spectate.'
    leave:
      name: '<red><bold>Stop Spectating'
      lore:
        - '<gray>Right-click to head back'
        - '<gray>into an arena of your own.'

rush:
  not-configured: '<prefix><red>This rush arena has no playable team base — tell an admin.'
  # Action bar on finishing a casual run.
  records-disabled: '<yellow>Casual run — play competitive to set records'
  mbedwars-missing: '<prefix><red>MBedwars is not installed — there is nothing to import from.'
  shop-unavailable: '<prefix><red>The shop needs MBedwars installed on this server.'
  shop-empty: '<prefix><red>The MBedwars shop has nothing usable in practice.'
  shop-cannot-afford: '<red>You cannot afford that'
  shop-inventory-full: '<yellow>Your inventory is full — the rest was dropped at your feet'
  # Action bar when using a special item that genuinely needs a real
  # multiplayer game around it (trap, magic milk, magnet shoes, …).
  special-unsupported: '<yellow>This item has no effect in solo practice'
  # The run's own ender chest, opened from any ender chest block on the map.
  ender-chest-title: '<dark_purple>Ender Chest'
  # Punch-to-deposit action bars. <count> is the resources moved.
  deposited: '<green>Deposited <white><count></white> resource(s)'
  deposit-full: '<yellow>Deposited <white><count></white> — the chest is full, the rest stayed with you'
  deposit-nothing: '<gray>Nothing to deposit'
  # Quick-buy pinning in the shop (mirrored into your MBedwars profile).
  quickbuy-pinned: '<green>Pinned to Quick Buy'
  quickbuy-unpinned: '<yellow>Removed from Quick Buy'
  quickbuy-full: '<red>Quick Buy is full — remove something first'
  # The teleporter special item: channel, cancel, land. <seconds>
  teleporter-channel: '<gray>Teleporting in <yellow><seconds>s<gray>… stand still'
  teleporter-cancelled: '<red>Teleport cancelled — you moved'
  teleporter-done: '<gray>Back at your base'
  # The tracker special item. <team> <distance>
  tracker: '<gray>Nearest target: <white><team> <dark_gray>— <yellow><distance>m <gray>(compass set)'
  tracker-nothing: '<yellow>Nothing left to track'
  # Defender bots (combat runs).
  bots:
    # Floats over each defender's head. <team> <health>
    tag: '<red><team> Defender <dark_red>♥ <white><health>'
    # A defender fell but its bed still stands — it will be back. <team>
    defender-down: '<yellow><team> defender down — it respawns while their bed stands'
    # A defender fell after its bed was gone: out for good. <team>
    defender-eliminated: '<prefix><green>A <white><team></white> defender is eliminated — no bed, no respawn.'
    # The player broke a team's bed on a combat run. <team>
    bed-destroyed: '<prefix><gold>Bed destroyed! <gray><white><team></white> defenders can no longer respawn.'
    # One enemy team fully out — the wipe that ends the run. <team>
    team-wiped: '<prefix><gold><bold>TEAM WIPE!</bold> <gray>Team <white><team></white> is out — bed gone, every defender down.'
    # A defender killed the player: a bedwars respawn, not a failed run.
    player-died: '<prefix><red>You were slain — your bed still stands, so you respawn at your base. Bought items are lost.'

# The PvP bot spar: an endless fight against an AI opponent. No timer, no
# leaderboard — kills, deaths and combos live on the sidebar.
pvpbot:
  # Floats over the bot's head as a single line; the disguise's own player
  # nameplate is hidden. <health> is the bot's remaining health points
  # (half-hearts, the scoreboard's 0-20 scale).
  bot-tag: '<white>Bot <red>♥ <white><health>'
  # Floating damage indicator; <damage> is the health points one hit dealt.
  damage-indicator: '<red>-<damage>❤'
  # Titles on losing / winning a stock. The death title's subtitle is the
  # 3-second respawn countdown (<seconds>); K/D lives in the chat summary.
  title:
    death: '<red><bold>YOU DIED'
    respawn-sub: '<gray>Respawning in <yellow><seconds><gray>...'
    respawned: '<green><bold>FIGHT'
    respawned-sub: ''
    kill: '<green><bold>Bot slain'
    kill-sub: '<gray>Kills <green><kills> <dark_gray>/ <gray>Deaths <red><deaths>'
  # Action bar counting down the bot's own 3-second respawn. <seconds>
  respawn-bar: '<gray>Bot respawns in <yellow><seconds><gray>...'
  # Chat summary after each stock; <hearts> is the health points (half-hearts)
  # the survivor had left.
  chat:
    bot-killed-player: '<prefix><red>Bot killed player <dark_gray>(<gray>bot had <red><hearts>❤<gray> left<dark_gray>)'
    player-killed-bot: '<prefix><green>Player killed bot <dark_gray>(<gray>you had <red><hearts>❤<gray> left<dark_gray>)'
    # Round results sent to everyone spectating the fight. <player> is the
    # practicing player; <hearts> the health the victor had left.
    spectator-bot-killed: '<prefix><red>The bot killed <white><player> <dark_gray>(<gray>bot had <red><hearts>❤<gray> left<dark_gray>)'
    spectator-player-killed: '<prefix><green><player> killed the bot <dark_gray>(<gray><player> had <red><hearts>❤<gray> left<dark_gray>)'
    # The session stats were wiped because the bot's difficulty or settings
    # changed — numbers against one opponent must not blend into another's.
    stats-reset: '<prefix><gray>Bot settings changed — your session stats were reset.'

# Action-bar speedometer shown during bridging runs.
# <speed> — current speed in m/s, <moved> — blocks traveled this run,
# <placed> — blocks placed this run. Set to '' to disable the text entirely.
speedometer:
  bar: '<gray>Speed <white><speed> m/s <dark_gray>• <gray>Moved <white><moved>m <dark_gray>• <gray>Placed <white><placed>'

inventory:
  stripped: '<red>Items that are not part of your kit were removed'
  # Action bar when a post-spawn check found kit items missing and put them back.
  kit-restored: '<yellow>Your kit was incomplete and has been restored'

# The live sidebar. <time> is the running timer (or the ready label below);
# values with no data show the gui.none placeholder.
board:
  title: '<gold><bold>Practice'
  timer-ready: '<dark_gray>ready'
  # <time>
  timer-running: '<yellow><time>'
  # Appended to the bottom of every sidebar once scoreboard.server-ip is set
  # in config.yml — every mode's board signs off the same way.
  # <server_ip>
  footer:
    - ''
    - '<gradient:#ffe08a:#ff9d2e><bold><server_ip>'
  # <arena> <time> <last> <best> <rank> <blocks>
  lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - ''
    - '<gray>Time: <time>'
    - '<gray>Last: <white><last>'
    - '<gray>Best: <white><best>'
    - '<gray>Rank: <white><rank>'
    - ''
    - '<gray>Blocks: <white><blocks>'
  # <arena> <time> <broken> <total> <reaction> <last> <best> <rank>
  # <reaction> is the average tool-switch reaction time this run.
  bedbreak-lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - ''
    - '<gray>Time: <time>'
    - '<gray>Broken: <white><broken><dark_gray>/<total>'
    - '<gray>Reaction: <white><reaction>'
    - '<gray>Last: <white><last>'
    - '<gray>Best: <white><best>'
    - '<gray>Rank: <white><rank>'
  # <arena> <streak> <best> <drop>
  # <streak> is consecutive successful clutches; <best> your highest ever;
  # <drop> is this round's rolled fall distance in blocks.
  mlg-lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - ''
    - '<gray>Drop: <white><drop> blocks'
    - '<gray>Streak: <white><streak>'
    - '<gray>Best: <white><best>'
  # The PvP bot spar board: session stats, no timer. <difficulty> is the
  # named preset the bot's knobs currently add up to (gui.pvpbot.preset.short),
  # or Custom for a hand-tuned mix. Stats reset when the bot's settings
  # change. <accuracy> is hits landed over swings thrown; <kd> kills over
  # deaths; <dodged> bot attacks that failed to land on you.
  # <arena> <kit> <difficulty> <kills> <deaths> <kd> <hits> <taken>
  # <accuracy> <dodged> <combo> <best-combo>
  pvpbot-lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - '<gray>Kit: <white><kit>'
    - '<gray>Difficulty: <difficulty>'
    - ''
    - '<gray>Kills: <green><kills> <dark_gray>/ <gray>Deaths: <red><deaths> <dark_gray>(K/D <white><kd><dark_gray>)'
    - '<gray>Hits: <white><hits> <dark_gray>/ <gray>Taken: <white><taken>'
    - '<gray>Accuracy: <white><accuracy> <dark_gray>• <gray>Dodged: <white><dodged>'
    - '<gray>Combo: <white><combo> <dark_gray>(best <best-combo>)'
  # The spectator sidebar summary: who you watch and their live run. Only
  # used when scoreboard.spectators-see-player-board is false in config.yml —
  # by default spectators see the watched player's own board instead.
  # <target> <arena> <mode> <time>
  spectate-lines:
    - ''
    - '<gray>Watching: <white><target>'
    - ''
    - '<gray>Arena: <white><arena>'
    - '<gray>Mode: <white><mode>'
    - '<gray>Time: <time>'
  # The rush board is assembled per run: these header lines, then one
  # objective-line per objective the map actually supports, then the
  # casual-line on unranked runs.
  rush:
    # <arena> <team> <mode> <time>
    lines:
      - ''
      - '<gray>Map: <white><arena>'
      - '<gray>Base: <white><team>'
      - '<gray>Mode: <mode>'
      - ''
      - '<gray>Time: <time>'
      - ''
    mode-competitive: '<gold>Competitive'
    mode-casual: '<white>Casual'
    # <objective> <best> — your best competitive time on that board
    objective-line: '<gray><objective>: <white><best>'
    # Combat runs only: the state of the wipe. <beds> enemy beds standing,
    # <defenders> defenders not yet eliminated, <deaths> your deaths this run.
    combat-line: '<gray>Beds: <white><beds> <dark_gray>• <gray>Defenders: <white><defenders> <dark_gray>• <gray>Deaths: <red><deaths>'
    casual-line: '<dark_gray>Not ranked — play competitive'

  beddefense:
    # <arena> <team> <mode> <defense> <time>
    lines:
      - ''
      - '<gray>Map: <white><arena>'
      - '<gray>Base: <white><team>'
      - '<gray>Mode: <mode>'
      - '<gray>Defense: <white><defense>'
      - ''
      - '<gray>Time: <time>'
      - ''
    mode-competitive: '<gold>Competitive'
    mode-practice: '<white>Practice'
    mode-preview: '<aqua>Preview'
    mode-guided: '<green>Guided'
    mode-edit: '<yellow>Editor'
    unnamed: 'unnamed'
    # <placed> <total>
    progress-line: '<gray>Blocks: <white><placed><dark_gray>/<white><total>'
    # Competitive: your best on this defense. <best>
    best-line: '<gray>Best: <white><best>'
    casual-line: '<dark_gray>Not ranked — play competitive'
    # Guided: the block the marker points at. <material>
    next-line: '<gray>Next: <white><material>'
    # Preview: how far the animation is. <step> <total>
    preview-line: '<gray>Step: <white><step><dark_gray>/<white><total>'
    # Editor. <blocks> <radius>
    edit-line: '<gray>Placed: <white><blocks> <dark_gray>(radius <radius>)'

# Bed defense practice: chat, action bar and title text. Menus are under
# gui.beddefense further down, the sidebar under board.beddefense.
beddefense:
  # The name the category picker and leaderboards show the mode under (when
  # guis.yml categories.entries has no 'beddefense' entry of its own).
  category-name: 'Bed Defense'
  not-a-rush-map: '<prefix><red>Bed defense practice needs a rush map with a team base and bed.'
  no-defense: '<prefix><yellow>There is no bed defense to build yet — design one in the editor, or pick one from the gallery.'
  forced-edit: '<prefix><yellow>No bed defenses exist yet, so you are in the <white>editor<yellow>: build one around your bed and save it.'
  # <id>
  unknown: '<prefix><red>No bed defense with id ''<id>''.'
  not-owner: '<prefix><red>That is not one of your bed defenses.'
  competitive-needs-shop: '<prefix><yellow>Competitive needs the MBedwars shop to buy blocks from — this round plays as practice.'
  # <name>
  deleted: '<prefix><gray>Deleted the bed defense <white><name><gray>.'
  # Action bar at the end of a practice round.
  records-disabled: '<gray>Practice rounds are not ranked — play competitive'
  # The hint floating over the bed at the start of a round. Blank to disable.
  hologram: '<yellow>Drop a block or use the menu<newline><gray>to preview this defense'
  # Board names: <name> is the defense's name.
  board-name: '<name> (Bed Defense)'
  board-name-strict: '<name> (Bed Defense, strict order)'
  list-empty: '<prefix><gray>No bed defenses to play yet. Design one: <white>/practice beddefense edit'
  # <count>
  list-header: '<prefix><gray>Bed defenses you can play (<white><count><gray>):'
  # <id> <name> <author> <likes> <players> <blocks>
  list-entry: '<dark_gray> • <white><name> <dark_gray>by <gray><author> <dark_gray>— <yellow><likes> likes<dark_gray>, <gray><players> players<dark_gray>, <gray><blocks> blocks <dark_gray>[<click:run_command:''/practice beddefense play <id>''><green>play</click><dark_gray>]'
  like:
    # <name>
    added: '<prefix><green>You liked <white><name><green>.'
    removed: '<prefix><gray>Like removed from <white><name><gray>.'
    own: '<prefix><red>You cannot like your own bed defense.'
  favorite:
    # <name>
    added: '<prefix><green><white><name><green> added to your favorites.'
    removed: '<prefix><gray><white><name><gray> removed from your favorites.'
  visibility:
    # <name>
    public: '<prefix><green><white><name><green> is now public — everyone can play it.'
    private: '<prefix><gray><white><name><gray> is now private — only you can play it.'
  strict:
    # A block placed out of sequence. <material> <step> <total>
    wrong-order: '<red>Wrong order — next is <white><material> <gray>(<step>/<total>)'
  preview:
    # <name>
    entered: '<prefix><gray>Previewing <white><name><gray>. Use the hotbar to step through it; drop or use the exit item to leave.'
    exited: '<prefix><gray>Preview over — back to building.'
    # <step> <total> <material>
    step: '<gray>Block <white><step><gray>/<white><total> <dark_gray>— <gray><material>'
    start: '<gray>At the start'
    done: '<green>That is the whole defense'
    playing: '<gray>Playing'
    paused: '<gray>Paused'
    no-building: '<red>Not while previewing'
    not-in-editor: '<red>Previews are for playing — save the build first'
  guided:
    entered: '<prefix><gray>Guided building: the glowing block is the next one to place. Untimed.'
    from-attempt: '<prefix><yellow>Timer cancelled. <gray>Guided building: the glowing block is the next one to place.'
    exited: '<prefix><gray>Guidance off — the next attempt is timed again.'
    # <material> <step> <total>
    next: '<gray>Next: <white><material> <dark_gray>(<step>/<total>)'
    # <name>
    done: '<prefix><green>Defense complete! <gray>Resetting for a timed attempt.'
  edit:
    # <radius>
    entered: '<prefix><gray>Editor: build within <white><radius><gray> blocks of the bed, then save from the bed defense item.'
    exit: '<prefix><gray>Leaving the editor.'
    out-of-radius: '<red>Too far from the bed'
    # <material>
    not-allowed: '<red><material> is not a bed defense block'
    bed-protected: '<red>The bed stays'
    empty: '<prefix><red>Nothing to save — place some blocks around the bed first.'
    # <name> <blocks>
    saved: '<prefix><green>Saved <white><name><green> (<blocks> blocks). It is private; publish it from the gallery to share it.'
    saved-public: '<prefix><green>Saved and published <white><name><green> (<blocks> blocks).'
    # <name>
    loaded: '<prefix><gray>Loaded <white><name><gray> into the editor.'
    reset: '<prefix><gray>Build cleared.'
    # <max>
    name-prompt: '<gold>Name your bed defense (up to <max> characters).'
    # <name>
    name-set: '<prefix><green>Named <white><name><green>.'
    # <max>
    name-invalid: '<prefix><red>That name will not do — 1 to <max> printable characters.'
    # <max>
    limit: '<prefix><red>You already have <max> saved bed defenses. Delete one to make room.'
    # A save refused because the exact same defense already exists.
    # <name> <author> <id>
    duplicate-title: '<red><bold>Already exists'
    duplicate-subtitle: '<gray><name> <dark_gray>by <gray><author>'
    duplicate: '<prefix><red>That bed defense already exists: <white><name> <gray>by <author>.'
    duplicate-actions: '<dark_gray>[<click:run_command:''/practice beddefense play <id>''><hover:show_text:''Play <name>''><green>Play it</hover></click><dark_gray>] [<click:run_command:''/practice beddefense like <id>''><hover:show_text:''Like <name>''><gold>Like it</hover></click><dark_gray>] [<click:run_command:''/practice beddefense favorite <id>''><hover:show_text:''Favorite <name>''><aqua>Favorite it</hover></click><dark_gray>]'

protect:
  pearls-disabled: '<prefix><red>Ender pearls are disabled in practice.'
  gamemode-locked: '<prefix><red>Leave practice before changing gamemode (/practice leave).'

world:
  unavailable: '<prefix><red>The practice world is unavailable — tell an admin.'
  entry-denied: '<prefix><red>Use /practice join to enter the practice world.'

leave:
  # <server>
  sending: '<prefix><gray>Sending you to <white><server><gray>…'

menu:
  # <menu> <menus>
  unknown: '<prefix><red>No menu named ''<menu>''. Menus: <white><menus>'
  item-locked: '<yellow>You need that to get back out'
  # <slot>
  item-given: '<prefix><green>Practice menu item added to hotbar slot <white><slot><green>.'
  item-given-hint: '<prefix><gray>Arrange your kit and run <white>/practice setup kit<gray> to include it for players.'
  # <player>
  item-given-other: '<prefix><green>Gave the practice menu item to <white><player><green>.'
  item-disabled: '<prefix><red>The menu item is disabled in config.yml (menu-item.enabled).'
  # <player>
  player-offline: '<prefix><red><player> is not online.'

sidebar:
  shown: '<prefix><green>Practice sidebar shown.'
  hidden: '<prefix><green>Practice sidebar hidden.'

arena:
  # <arena>
  unknown: '<prefix><red>No arena named ''<arena>''. See /practice list.'
