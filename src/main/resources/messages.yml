# PracticeCore messages
#
# Every piece of text the plugin shows a player lives here. Formatting is
# MiniMessage (https://docs.advntr.dev/minimessage/format.html), so colors,
# gradients, hover and click are all available.
#
# - <prefix> inserts the prefix defined below.
# - Values in <angle.brackets> listed above each entry are its placeholders.
#   Player-supplied text is inserted literally and can never inject formatting.
# - Set a message to '' to silence it entirely.
# - A message may be a single line or a list of lines.
#
# Do not edit config-version by hand; PracticeCore uses it to migrate this file
# across upgrades (backups land in backups/).
config-version: 3

prefix: '<gold>Practice <dark_gray>» '

general:
  players-only: '<prefix><red>That has to be run in-game.'
  # <usage>
  usage: '<prefix><red>Usage: <white><usage>'

permission:
  use: '<prefix><red>You may not use practice arenas.'
  menu: '<prefix><red>You may not open the practice menu.'
  leaderboard: '<prefix><red>You may not view leaderboards.'
  spectate: '<prefix><red>You may not spectate practice sessions.'
  stats-other: '<prefix><red>You may not view other players'' stats.'
  setup: '<prefix><red>You may not configure arenas.'
  arena-admin: '<prefix><red>You may not administer arenas.'
  pb-reset: '<prefix><red>You may not wipe personal bests.'
  item: '<prefix><red>You may not give out the practice menu item.'
  reload: '<prefix><red>You may not reload PracticeCore.'
  world: '<prefix><red>You may not manage the practice world.'

session:
  ready: '<prefix><green>Arena ready — the timer starts when you move. Good luck!'
  # <arena>
  switched: '<prefix><green>Switched to <white><arena><green>.'
  ended: '<prefix><gray>Practice session ended.'
  not-practicing: '<prefix><red>You are not practicing.'
  preparing: '<prefix><red>Your arena is still being prepared — one moment.'
  # Action bar the moment a join starts — big maps take a second or two to
  # paste, and silence after the command reads as lag. <arena>
  building: '<gray>Building <white><arena></white><gray>…'
  # Action bar when the arena is built and the teleport is on its way.
  teleporting: '<gray>Arena ready — teleporting you in…'
  setup-in-progress: '<prefix><red>Finish or cancel arena setup first.'
  teleport-failed: '<prefix><red>Could not send you to the arena.'
  state-restored: '<prefix><gray>Your pre-practice state was restored.'
  # Shown when a switch or join fails after the previous session already ended.
  restored-after-failure: '<prefix><red>That arena could not be opened, so you were returned to where you started.'

run:
  # <time>
  finished-pb: '<prefix><green>Finished in <white><time><green> — new personal best!'
  # <time> <best>
  finished: '<prefix><gray>Finished in <white><time><gray> (best <white><best><gray>)'
  # <time>
  finished-first: '<prefix><gray>Finished in <white><time>'
  failed: '<prefix><gray>You fell! Resetting…'
  restarted: '<prefix><gray>Run restarted.'
  timer-not-started: '<yellow>The timer has not started yet'
  title:
    # <time>
    pb: '<gold><time>'
    normal: '<yellow><time>'
  subtitle:
    pb: '<green>New personal best!'
    # <delta>
    behind: '<gray>+<delta> off your best'
    first: '<gray>Run complete'
  # <player> <arena> <time> <previous-holder> <delta>
  record-broadcast: '<prefix><gold><player> <gray>set a new record on <white><arena> <dark_gray>— <yellow><time>'
  record-broadcast-beaten: '<prefix><gold><player> <gray>set a new record on <white><arena> <dark_gray>— <yellow><time> <dark_gray>(beat <previous-holder> by <delta>)'
  # Quieter than the record shout — an improved personal best, not a takeover.
  # <player> <arena> <time> <improvement>
  pb-broadcast: '<prefix><gray><player> beat their personal best on <white><arena> <dark_gray>— <gray><time> (-<improvement>)'

build:
  out-of-bounds: '<red>Out of bounds'
  break-own-only: '<red>You can only break blocks you placed'

mlg:
  # Shown when the bucket is used while still standing on the platform.
  jump-first: '<red>Clutch on the way down, not before'
  # <streak>
  success: '<prefix><green>MLG! <gray>Streak: <white><streak>'
  # <streak> — the clutch that beat your highest streak ever
  success-best: '<prefix><green>MLG! <gray>Streak: <white><streak> <gold>— new best!'

# Spectator mode: /practice spectate, the main menu's Spectate button, and
# the three hotbar tools every spectator carries.
spectate:
  # <target> <arena>
  started: '<prefix><gray>Now spectating <white><target> <gray>on <white><arena><gray>. Fly freely — the bed brings you back.'
  stopped: '<prefix><gray>Stopped spectating — welcome back.'
  # The spectator was pulled out by an external teleport (/spawn, /tpa, …).
  ended: '<prefix><gray>Spectating ended.'
  # The watched player's session ended (they left, finished for good, or quit).
  target-left: '<prefix><gray>The player you were watching stopped practicing.'
  # <player>
  target-not-practicing: '<prefix><red><player> is not practicing right now.'
  not-spectating: '<prefix><red>You are not spectating anyone.'
  # Another plugin cancelled the teleport into the practice world.
  entry-blocked: '<prefix><red>Something blocked your way into the practice world — tell an admin.'
  self: '<prefix><red>You cannot spectate yourself.'
  # <player>
  unknown-player: '<prefix><red>No online player named <white><player><red>.'
  # Sent to the watched player. <player>
  watcher-joined: '<prefix><gray><player> is now spectating you.'
  # <player>
  watcher-left: '<prefix><gray><player> stopped spectating you.'
  # Action bar when a spectator drifts too far and is pulled back.
  leash: '<gray>Pulled back to the arena you are spectating'
  item:
    teleport:
      # <target>
      name: '<aqua><bold>Teleport to <target>'
      lore:
        - '<gray>Right-click to snap back'
        - '<gray>to the player you watch.'
    menu:
      name: '<white><bold>Switch Player'
      lore:
        - '<gray>Right-click to pick another'
        - '<gray>player to spectate.'
    leave:
      name: '<red><bold>Stop Spectating'
      lore:
        - '<gray>Right-click to head back'
        - '<gray>into an arena of your own.'

rush:
  not-configured: '<prefix><red>This rush arena has no playable team base — tell an admin.'
  # Action bar on finishing a casual run.
  records-disabled: '<yellow>Casual run — play competitive to set records'
  mbedwars-missing: '<prefix><red>MBedwars is not installed — there is nothing to import from.'
  shop-unavailable: '<prefix><red>The shop needs MBedwars installed on this server.'
  shop-empty: '<prefix><red>The MBedwars shop has nothing usable in practice.'
  shop-cannot-afford: '<red>You cannot afford that'
  shop-inventory-full: '<yellow>Your inventory is full — the rest was dropped at your feet'
  # Action bar when using a special item that needs enemies or a real game
  # (tracker, guard dog, trap, …) — it was bought, but does nothing here.
  special-unsupported: '<yellow>This item has no effect in solo practice'

# The PvP bot spar: an endless fight against an AI opponent. No timer, no
# leaderboard — kills, deaths and combos live on the sidebar.
pvpbot:
  # Floats over the bot's head as a single line; the disguise's own player
  # nameplate is hidden. <health> is the bot's remaining hearts.
  bot-tag: '<white>Bot <red>♥ <white><health>'
  # Floating damage indicator; <damage> is the hearts one hit dealt.
  damage-indicator: '<red>-<damage>❤'
  # Titles on losing / winning a stock. The death title's subtitle is the
  # 3-second respawn countdown (<seconds>); K/D lives in the chat summary.
  title:
    death: '<red><bold>YOU DIED'
    respawn-sub: '<gray>Respawning in <yellow><seconds><gray>...'
    respawned: '<green><bold>FIGHT'
    respawned-sub: ''
    kill: '<green><bold>Bot slain'
    kill-sub: '<gray>Kills <green><kills> <dark_gray>/ <gray>Deaths <red><deaths>'
  # Action bar counting down the bot's own 3-second respawn. <seconds>
  respawn-bar: '<gray>Bot respawns in <yellow><seconds><gray>...'
  # Chat summary after each stock; <hearts> is what the survivor had left.
  chat:
    bot-killed-player: '<prefix><red>Bot killed player <dark_gray>(<gray>bot had <red><hearts>❤<gray> left<dark_gray>)'
    player-killed-bot: '<prefix><green>Player killed bot <dark_gray>(<gray>you had <red><hearts>❤<gray> left<dark_gray>)'

# Action-bar speedometer shown during bridging runs.
# <speed> — current speed in m/s, <moved> — blocks traveled this run,
# <placed> — blocks placed this run. Set to '' to disable the text entirely.
speedometer:
  bar: '<gray>Speed <white><speed> m/s <dark_gray>• <gray>Moved <white><moved>m <dark_gray>• <gray>Placed <white><placed>'

inventory:
  stripped: '<red>Items that are not part of your kit were removed'
  # Action bar when a post-spawn check found kit items missing and put them back.
  kit-restored: '<yellow>Your kit was incomplete and has been restored'

# The live sidebar. <time> is the running timer (or the ready label below);
# values with no data show the gui.none placeholder.
board:
  title: '<gold><bold>Practice'
  timer-ready: '<dark_gray>ready'
  # <time>
  timer-running: '<yellow><time>'
  # Appended to the bottom of every sidebar once scoreboard.server-ip is set
  # in config.yml — every mode's board signs off the same way.
  # <server_ip>
  footer:
    - ''
    - '<gradient:#ffe08a:#ff9d2e><bold><server_ip>'
  # <arena> <time> <last> <best> <rank> <blocks>
  lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - ''
    - '<gray>Time: <time>'
    - '<gray>Last: <white><last>'
    - '<gray>Best: <white><best>'
    - '<gray>Rank: <white><rank>'
    - ''
    - '<gray>Blocks: <white><blocks>'
  # <arena> <time> <broken> <total> <reaction> <last> <best> <rank>
  # <reaction> is the average tool-switch reaction time this run.
  bedbreak-lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - ''
    - '<gray>Time: <time>'
    - '<gray>Broken: <white><broken><dark_gray>/<total>'
    - '<gray>Reaction: <white><reaction>'
    - '<gray>Last: <white><last>'
    - '<gray>Best: <white><best>'
    - '<gray>Rank: <white><rank>'
  # <arena> <streak> <best> <drop>
  # <streak> is consecutive successful clutches; <best> your highest ever;
  # <drop> is this round's rolled fall distance in blocks.
  mlg-lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - ''
    - '<gray>Drop: <white><drop> blocks'
    - '<gray>Streak: <white><streak>'
    - '<gray>Best: <white><best>'
  # The PvP bot spar board: session stats, no timer.
  # <arena> <kit> <kills> <deaths> <hits> <taken> <combo> <best-combo>
  pvpbot-lines:
    - ''
    - '<gray>Arena: <white><arena>'
    - '<gray>Kit: <white><kit>'
    - ''
    - '<gray>Kills: <green><kills> <dark_gray>/ <gray>Deaths: <red><deaths>'
    - '<gray>Hits: <white><hits> <dark_gray>/ <gray>Taken: <white><taken>'
    - '<gray>Combo: <white><combo> <dark_gray>(best <best-combo>)'
  # The spectator sidebar: who you watch and their live run.
  # <target> <arena> <mode> <time>
  spectate-lines:
    - ''
    - '<gray>Watching: <white><target>'
    - ''
    - '<gray>Arena: <white><arena>'
    - '<gray>Mode: <white><mode>'
    - '<gray>Time: <time>'
  # The rush board is assembled per run: these header lines, then one
  # objective-line per objective the map actually supports, then the
  # casual-line on unranked runs.
  rush:
    # <arena> <team> <mode> <time>
    lines:
      - ''
      - '<gray>Map: <white><arena>'
      - '<gray>Base: <white><team>'
      - '<gray>Mode: <mode>'
      - ''
      - '<gray>Time: <time>'
      - ''
    mode-competitive: '<gold>Competitive'
    mode-casual: '<white>Casual'
    # <objective> <best> — your best competitive time on that board
    objective-line: '<gray><objective>: <white><best>'
    casual-line: '<dark_gray>Not ranked — play competitive'

protect:
  pearls-disabled: '<prefix><red>Ender pearls are disabled in practice.'
  gamemode-locked: '<prefix><red>Leave practice before changing gamemode (/practice leave).'

world:
  unavailable: '<prefix><red>The practice world is unavailable — tell an admin.'
  entry-denied: '<prefix><red>Use /practice join to enter the practice world.'

leave:
  # <server>
  sending: '<prefix><gray>Sending you to <white><server><gray>…'

menu:
  # <menu> <menus>
  unknown: '<prefix><red>No menu named ''<menu>''. Menus: <white><menus>'
  item-locked: '<yellow>You need that to get back out'
  # <slot>
  item-given: '<prefix><green>Practice menu item added to hotbar slot <white><slot><green>.'
  item-given-hint: '<prefix><gray>Arrange your kit and run <white>/practice setup kit<gray> to include it for players.'
  # <player>
  item-given-other: '<prefix><green>Gave the practice menu item to <white><player><green>.'
  item-disabled: '<prefix><red>The menu item is disabled in config.yml (menu-item.enabled).'
  # <player>
  player-offline: '<prefix><red><player> is not online.'

sidebar:
  shown: '<prefix><green>Practice sidebar shown.'
  hidden: '<prefix><green>Practice sidebar hidden.'

arena:
  # <arena>
  unknown: '<prefix><red>No arena named ''<arena>''. See /practice list.'
  # <arena>
  incomplete: '<prefix><red>Arena ''<arena>'' is not fully configured.'
  # <arena>
  locked: '<prefix><red>You do not have access to the <white><arena><red> arena.'
  none-available: '<prefix><red>There are no arenas you can join.'
  broken: '<prefix><red>This arena is missing its spawn or finish trigger — tell an admin.'
  broken-trigger: '<prefix><red>This arena''s finish trigger is misconfigured — tell an admin.'
  schematic-failed: '<prefix><red>Could not load the arena schematic — tell an admin.'
  paste-failed: '<prefix><red>Failed to build your arena — tell an admin.'
  list-empty: '<prefix><gray>No arenas are available. Admins: <white>/practice setup start <name>'
  list-header: '<prefix><gray>Arenas:'
  # <arena> <display> <mode> <locked>
  list-entry: '<dark_gray> • <white><arena> <dark_gray>— <gray><display> <dark_gray>[<mode>]<locked>'
  list-locked-suffix: ' <red>(locked)'

leaderboard:
  # <arena>
  empty: '<prefix><gray>Nobody has finished <white><arena><gray> yet.'
  # <arena>
  header: '<prefix><gray>Top times — <white><arena><gray>:'
  # <rank> <player> <time>
  entry: '<dark_gray> #<rank> <white><player> <dark_gray>— <yellow><time>'
  # <rank> <total>
  your-rank: '<dark_gray> … you are #<rank> of <total>'
  # <arena>
  rush-pick-board: '<prefix><gray>''<arena>'' is a rush arena; pick a board: <white><arena>#bed<gray>, <white><arena>#emerald<gray> or <white><arena>#diamond<gray>.'
  # Arenas of modes that score in-session (MLG streaks, PvP bot spars).
  not-ranked: '<prefix><gray>''<arena>'' has no time leaderboard — its mode is scored in-session, on the sidebar.'

stats:
  # <player>
  unknown-player: '<prefix><red>No player named ''<player>'' in the plugin''s records.'
  # <player>
  empty: '<prefix><gray><player> has no recorded times.'
  # <player>
  header: '<prefix><gray>Personal bests — <white><player><gray>:'
  # <arena> <time> <rank> <finishes>
  entry: '<dark_gray> • <white><arena> <dark_gray>— <yellow><time> <dark_gray>(#<rank>, <finishes> run(s))'
  # <arena> <time> <finishes>
  entry-unranked: '<dark_gray> • <white><arena> <dark_gray>— <yellow><time> <dark_gray>(<finishes> run(s))'
  # <player>
  reset-notice: '<prefix><gray>An admin reset your practice personal bests.'
  # Clicking a stats entry whose arena has since been deleted.
  arena-gone: '<prefix><red>That arena no longer exists.'

help:
  player:
    - '<prefix><gray>Practice commands:'
    - '<dark_gray> • <white>/practice join [arena] <dark_gray>— start practicing'
    - '<dark_gray> • <white>/practice leave <dark_gray>— return to where you were'
    - '<dark_gray> • <white>/practice menu [menu] <dark_gray>— open the practice GUI (or one menu directly)'
    - '<dark_gray> • <white>/practice list <dark_gray>— available arenas'
    - '<dark_gray> • <white>/practice stats [player] <dark_gray>— personal bests'
    - '<dark_gray> • <white>/practice top [arena] <dark_gray>— leaderboards'
    - '<dark_gray> • <white>/practice sidebar <dark_gray>— show or hide the live timer'
    - '<dark_gray> • <white>/practice spectate [player] <dark_gray>— watch someone practice'
  setup:
    - '<dark_gray> • <white>/practice setup … <dark_gray>— create an arena'
    - '<dark_gray> • <white>/practice edit <arena> <dark_gray>— reopen a saved arena'
    - '<dark_gray> • <white>/practice rush import <map> <dark_gray>— pull a map from MBedwars'
    - '<dark_gray> • <white>/practice rush importall teams:<n> size:<n> <dark_gray>— pull every matching map'
  setup-detail:
    - '<prefix><gray>Creating an arena:'
    - '<dark_gray> • <white>/practice setup start <name> <dark_gray>— begin (needs a //copy''d build)'
    - '<dark_gray> • <white>/practice setup spawn <dark_gray>— set the player spawn where you stand'
    - '<dark_gray> • <gray>place buttons or plates <dark_gray>— each adds a finish trigger (<white>/practice setup trigger clear<gray> restarts)'
    - '<dark_gray> • <white>/practice setup gui <dark_gray>— do all of this from a menu instead'
    - '<dark_gray> • <white>/practice setup kit [load] <dark_gray>— save your inventory as the kit'
    - '<dark_gray> • <white>/practice setup save | cancel | info'
    - '<prefix><gray>Editing an existing arena:'
    - '<dark_gray> • <white>/practice edit <arena> <dark_gray>— reopen it with every setting pre-loaded'
    - '<dark_gray> • <white>/practice setup capture <dark_gray>— save in-world changes into the schematic'
    - '<dark_gray> • <white>/practice setup schematic <dark_gray>— replace it from your WorldEdit clipboard'
    - '<dark_gray> • <white>/practice setup display <text> | icon [material] | permission <node|default>'
    - '<dark_gray> • <white>/practice setup mode <id> | category <name|default> | blocks <true|false>'
    - '<dark_gray> • <white>/practice setup rush … <dark_gray>— team spawns, beds, generators, dealers (rush mode)'
    - '<dark_gray> • <white>/practice setup pvpbot bot <dark_gray>— the bot''s spawn point (pvpbot mode)'
  setup-rush:
    - '<prefix><gray>Building a rush arena by hand (after <white>/practice setup mode rush<gray>):'
    - '<dark_gray> • <white>/practice setup rush team <color> <dark_gray>— set that base''s spawn where you stand'
    - '<dark_gray> • <white>/practice setup rush bed <color> <dark_gray>— look at that team''s bed'
    - '<dark_gray> • <white>/practice setup rush gen <iron|gold|diamond|emerald> <dark_gray>— stand on the spawner block'
    - '<dark_gray> • <white>/practice setup rush dealer <dark_gray>— shop NPC spot where you stand'
    - '<dark_gray> • <white>/practice setup rush clear <dark_gray>— wipe the rush layout'
    - '<dark_gray> • <gray>Or skip all of this: <white>/practice rush import <mbedwars-arena>'
  setup-pvpbot:
    - '<prefix><gray>Building a PvP bot arena (after <white>/practice setup mode pvpbot<gray>):'
    - '<dark_gray> • <white>/practice setup pvpbot bot <dark_gray>— set the bot''s spawn where you stand'
    - '<dark_gray> • <white>/practice setup pvpbot clear <dark_gray>— remove the bot spawn marker'
    - '<dark_gray> • <gray>No marker? The bot spawns a few blocks ahead of the player spawn.'
  arena:
    - '<dark_gray> • <white>/practice arena … <dark_gray>— administer saved arenas'
  item:
    - '<dark_gray> • <white>/practice item [player] <dark_gray>— get the hotbar menu item'
  pb:
    - '<dark_gray> • <white>/practice pb reset <player> [arena|all] <dark_gray>— wipe personal bests'
  world:
    - '<dark_gray> • <white>/practice world info|regen <dark_gray>— practice world management'
  reload:
    - '<dark_gray> • <white>/practice reload <dark_gray>— reload config, messages and arenas'

# ---------------------------------------------------------------- admin text

admin:
  # <note>
  note: '<prefix><gray><note>'
  # <note>
  problem: '<prefix><red><note>'
  # <note>
  done: '<prefix><green><note>'

setup:
