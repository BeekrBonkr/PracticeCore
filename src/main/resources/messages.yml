# ------------------------------------------------------------ GUI menu text

# Shared labels used by menus AND by chat, boards and broadcasts.
label:
  # Boolean state words. The word carries the meaning; the color decorates (R31).
  state:
    'on': '<green>on'
    'off': '<red>off'
    shown: '<green>shown'
    hidden: '<red>hidden'
    public: '<green>public'
    private: '<gray>private'
    selected: '<green>selected'
  # Rush objective names — boards, stats, broadcasts and the rush menus.
  objective:
    bed: 'Bed Rush'
    emerald: 'Emerald Rush'
    diamond: 'Diamond Rush'
    team_wipe: 'Team Wipe'
  # PvP bot difficulty presets, keyed by preset id. `long` carries a
  # tagline for menus; `short` is the bare name for the sidebar.
  difficulty:
    long:
      rookie: '<green>Rookie <dark_gray>— slow hands, soft aim'
      brawler: '<yellow>Brawler <dark_gray>— a fair fight'
      veteran: '<red>Veteran <dark_gray>— sharp and relentless'
      demon: '<dark_red>Demon <dark_gray>— frame-perfect menace'
      unfair: '<dark_purple><bold>Unfair</bold> <dark_gray>— it read your habits before you had them'
      suffer: '<red><bold>Suffer</bold> <dark_gray>— nothing it does is impossible; all of it is'
      custom: '<white>Custom <dark_gray>— your own mix'
    short:
      rookie: '<green>Rookie'
      brawler: '<yellow>Brawler'
      veteran: '<red>Veteran'
      demon: '<dark_red>Demon'
      unfair: '<dark_purple><bold>Unfair'
      suffer: '<red><bold>Suffer'
      custom: '<white>Custom'

