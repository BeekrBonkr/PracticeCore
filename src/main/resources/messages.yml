  pasting: '<gray>Pasting <white><arena></white><gray>…'
  # <arena> <holder>
  busy: '<prefix><red>Setup is already in progress by <white><holder><red> on ''<arena>''.'
  clipboard-empty: '<prefix><red>Your WorldEdit clipboard is empty. Select your arena build and run //copy first.'
