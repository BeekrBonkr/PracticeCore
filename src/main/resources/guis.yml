# PracticeCore GUI layout
#
# This file controls menu STRUCTURE: which slot each button occupies, its icon
# material, row counts, filler and navigation items. All display text (titles,
# names, lore) lives in messages.yml.
#
# - Slots are raw inventory indices: 0 is the top-left, each row is 9 wide.
# - Set a button to enabled: false (or slot: -1) to hide it.
# - Any key you remove falls back to the built-in default.
#
# Do not edit config-version by hand; PracticeCore uses it to migrate this file
# across upgrades (backups land in backups/).
config-version: 4

# The glass pane border drawn around every menu.
filler:
  material: GRAY_STAINED_GLASS_PANE

# Navigation row shared by every paged menu (six-row menus).
nav:
  back: {slot: 45, material: ARROW}
  previous: {slot: 48, material: SPECTRAL_ARROW}
  page: {slot: 49, material: MAP}
  next: {slot: 50, material: SPECTRAL_ARROW}
  close: {slot: 53, material: BARRIER}
  # Icon shown in the middle of an empty list.
  empty-material: COBWEB

# The hub menu (/practice menu).
main:
  rows: 4
  buttons:
    play: {enabled: true, slot: 10, material: COMPASS}
    random: {enabled: true, slot: 11, material: ENDER_EYE}
    leaderboards: {enabled: true, slot: 12, material: GOLD_INGOT}
    stats: {enabled: true, slot: 13, material: WRITABLE_BOOK}
    restart: {enabled: true, slot: 14, material: CLOCK}
    # material is the icon while the sidebar is shown; material-off while hidden.
    sidebar: {enabled: true, slot: 15, material: ITEM_FRAME, material-off: GLOW_ITEM_FRAME}
    help: {enabled: true, slot: 16, material: PAPER}
    # Only rendered during a PvP bot session.
    bot: {enabled: true, slot: 20, material: ZOMBIE_HEAD}
    # Opens the spectate target picker; needs practicecore.spectate.
    spectate: {enabled: true, slot: 19, material: SPYGLASS}
    settings: {enabled: true, slot: 21, material: COMPARATOR}
    leave: {enabled: true, slot: 23, material: OAK_DOOR}

# The per-player settings menu.
settings:
  rows: 3
  back: {slot: 18}
  close: {slot: 26}
  buttons:
    night-vision: {enabled: true, slot: 11, material: GOLDEN_CARROT}
    # The wool button's icon always shows the currently selected color.
    wool-color: {enabled: true, slot: 13}
    time: {enabled: true, slot: 15, material: CLOCK}

# The rush pre-join menu: team base, match modifiers, defender bots, start.
# With no bots every objective is armed on every run; with bots the run
# becomes a combat run whose goal is the team wipe.
#
# Four rows that read top to bottom as the order the choices are made: where
# you start, what you start with, who is waiting for you, then go — and a
# preset strip along the bottom border for one-click starts.
rush:
  rows: 6
  back: {slot: 45}
  close: {slot: 53}
  buttons:
    # Row 1 — where the run starts. The icon is always the team's own wool.
    team: {slot: 13}
    # Row 2 — the six match modifiers.
    blocks: {slot: 20, material: WHITE_WOOL}
    currency: {slot: 21, material: IRON_INGOT}
    pickaxe: {slot: 22, material: IRON_PICKAXE}
    # Opens the bed-defense gallery below; its icon follows the chosen preset.
    defense: {slot: 23}
    generators: {slot: 24, material: FURNACE}
    # Starter TNT — auto-ignites on place, like every rush TNT.
    tnt: {slot: 25, material: TNT}
    # Row 3 — defender bots at enemy bases. The three lineup buttons only
    # appear while the count is above zero; the armor and sword icons follow
    # the selected tier.
    bots: {slot: 29, material: ZOMBIE_HEAD}
    bot-difficulty: {slot: 30, material: NETHER_STAR}
    bot-armor: {slot: 31}
    bot-sword: {slot: 32}
    # Row 4 — go. Start carries a summary of everything set above it.
    start: {slot: 39, material: LIME_DYE}
    # Instant ranked start: generators on, no starting items, defenses on.
    competitive: {slot: 41, material: NETHER_STAR}
    # The preset strip: each tile writes a known-good set of modifiers over
    # the player's dials and starts the run immediately. The two competitive
    # presets pin the ranked loadout; the rest are casual. A preset the
    # config has switched off (per-team 0, bots capped at none) never shows.
    preset-competitive: {slot: 46, material: DIAMOND}
    preset-competitive-wipe: {slot: 47, material: DIAMOND_SWORD}
    preset-bridge: {slot: 48, material: SCAFFOLDING}
    preset-bed-break: {slot: 49, material: TNT}
    preset-warmup: {slot: 50, material: FEATHER}
    preset-skirmish: {slot: 51, material: IRON_SWORD}
    preset-sandbox: {slot: 52, material: CHEST}

# The bed-defense gallery, opened by the rush menu's defense button. One tile
# per preset in config.yml's rush.defense-presets; each tile's icon is that
# preset's own (or its outermost material).
rush-defenses:
  rows: 5
  back: {slot: 36}
  close: {slot: 44}

# The PvP bot settings menu, opened by the in-arena settings item.
# The kit and gear buttons' icons follow the current selection.
pvpbot:
  rows: 5
  back: {slot: 36}
  close: {slot: 40}
  buttons:
    kit: {slot: 11}
    preset: {slot: 13, material: NETHER_STAR}
    gear: {slot: 15}
    evasiveness: {slot: 19, material: FEATHER}
    cps: {slot: 20, material: CLOCK}
    accuracy: {slot: 21, material: TARGET}
    combos: {slot: 22, material: RABBIT_FOOT}
    reach: {slot: 23, material: STICK}
    aggression: {slot: 24, material: BLAZE_POWDER}
    rod: {slot: 29, material: FISHING_ROD}
    bow: {slot: 30, material: BOW}
    block: {slot: 31, material: SHIELD}
    build: {slot: 32, material: WHITE_WOOL}

# The PvP kit gallery (left-click selects, right-click previews).
pvpbot-kits:
  rows: 5
  back: {slot: 36}
  close: {slot: 40}

# The full-inventory kit preview window.
pvpbot-preview:
  back: {slot: 0}
  close: {slot: 8}

# The mirrored MBedwars item shop opened at a rush dealer NPC, laid out like
# the MBedwars HypixelV2 shop: Quick Buy first, page tabs beside it, a
# separator row marking the open tab, and the items in the grid below.
rushshop:
  close: {slot: 49}
  # The Quick Buy tab's icon.
  quickbuy: {material: NETHER_STAR}
  # The separator row: the plain pane, and the pane under the open tab.
  separator: GRAY_STAINED_GLASS_PANE
  separator-selected: LIME_STAINED_GLASS_PANE
  # An unfilled Quick Buy slot.
  quickbuy-empty: RED_STAINED_GLASS_PANE

# Arena categories. An arena's category is the folder its own folder sits in:
# templates/<category>/<arena>/ is listed under <category>, and an arena
# straight in templates/ is listed under its mode id. The Play button opens a
# category picker and each category gets its own arena menu.
categories:
  # false = skip the picker and list every arena in one menu, as before.
  enabled: true
  # Optional per-category display overrides. The key is the category name:
  #   entries:
  #     bridging: {name: 'Bridging', icon: LIGHT_BLUE_WOOL}
  #     bedbreak: {name: 'Bed Break', icon: RED_BED}
  entries: {}
