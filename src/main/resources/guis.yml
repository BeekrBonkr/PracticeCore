# PracticeCore GUI layout
#
# This file controls menu STRUCTURE: which slot each button occupies, its icon
# material, row counts, filler and navigation items. All display text (titles,
# names, lore) lives in messages.yml.
#
# - Slots are raw inventory indices: 0 is the top-left, each row is 9 wide.
# - Set a button to enabled: false (or slot: -1) to hide it.
# - Any key you remove falls back to the built-in default.
#
# Do not edit config-version by hand; PracticeCore uses it to migrate this file
# across upgrades (backups land in backups/).
config-version: 13

# Navigation row shared by every paged menu (six-row menus).
nav:
  back:
    material: ARROW
  close:
    material: BARRIER
  # Icon shown in the middle of an empty list.
  empty-material: COBWEB
  next:
    material: SPECTRAL_ARROW
  page:
    material: MAP
  previous:
    material: SPECTRAL_ARROW

# The hub menu (/practice menu).
main:
  buttons:
    # Only rendered during a session in a mode with settings of its own —
    # the PvP bot's knobs, the rush modifiers or the bed defense round
    # settings. The icon follows the mode.
    mode-settings:
      enabled: true
      material-pvpbot: ZOMBIE_HEAD
      material-rush: WHITE_BED
      material-beddefense: RED_BED
      slot: 31
    help:
      enabled: true
      material: PAPER
      slot: 16
    leaderboards:
      enabled: true
      material: GOLD_INGOT
      slot: 12
    leave:
      enabled: true
      material: OAK_DOOR
      slot: 24
    play:
      enabled: true
      material: COMPASS
      slot: 10
    random:
      enabled: false
      material: ENDER_EYE
      slot: 11
    restart:
      enabled: true
      material: CLOCK
      slot: 14
    settings:
      enabled: true
      material: COMPARATOR
      slot: 22
    sidebar:
      enabled: false
      material: OAK_SIGN
      slot: 15
    # Opens the spectate target picker; needs practicecore.spectate.
    spectate:
      enabled: true
      material: SPYGLASS
      slot: 20
    stats:
      enabled: true
      material: BOOK
      slot: 13
  rows: 4

# The per-player settings menu.
settings:
  buttons:
    night-vision:
      enabled: true
      material: GOLDEN_CARROT
      slot: 11
    time:
      enabled: true
      material: DAYLIGHT_DETECTOR
      slot: 15
    # The wool button's icon always shows the currently selected color.
    wool-color:
      enabled: true
      slot: 13
      
    sidebar:
      enabled: true
      material: OAK_SIGN
      slot: 16
  rows: 3

# Arena categories. Every arena belongs to a category (arena.yml `category:`,
# defaulting to the arena's mode id); the Play button opens a category picker
# and each category gets its own arena menu.
categories:
  # false = skip the picker and list every arena in one menu, as before.
  enabled: true

# The bed-defense gallery, opened by the rush menu's defense button. One tile
# per preset in config.yml's rush.defense-presets; each tile's icon is that
# preset's own (or its outermost material).
rush-defenses:
  rows: 5

# One defense's actions (right-click on a gallery tile).
beddefense-actions:
  buttons:
    board:
      material: GOLD_INGOT
      slot: 14
    delete:
      material: LAVA_BUCKET
      slot: 22
    # Only on your own defenses (delete: also admins).
    edit:
      material: WRITABLE_BOOK
      slot: 20
    favorite:
      material: AMETHYST_SHARD
      slot: 13
    like:
      material: GOLD_NUGGET
      slot: 12
    # The play tile's icon is the defense's own.
    play:
      slot: 11
    # On everyone else's public defenses: flag it for a moderator.
    report:
      material: BELL
      slot: 15
    # Moderators only: the open reports on this defense.
    reports:
      material: WRITTEN_BOOK
      slot: 23
    # material while public; material-private while private.
    visibility:
      material: LANTERN
      material-private: SOUL_LANTERN
      slot: 21
  rows: 4

# The editor's menu behind the same item while designing.
beddefense-editor:
  buttons:
    delete:
      material: LAVA_BUCKET
      slot: 15
    exit:
      material: OAK_DOOR
      slot: 16
    load:
      material: BOOKSHELF
      slot: 12
    name:
      material: NAME_TAG
      slot: 10
    reset:
      material: RED_DYE
      slot: 13
    save:
      material: EMERALD
      slot: 11
    visibility:
      material: LANTERN
      material-private: SOUL_LANTERN
      slot: 14
  rows: 4

# The defense gallery: public / mine / favorites tabs along the footer, plus
# a review tab that only moderators (practicecore.beddefense.moderate) see.
beddefense-gallery:
  tabs:
    favorites:
      material: AMETHYST_SHARD
      slot: 51
    mine:
      slot: 47
    public:
      material: BOOKSHELF
      slot: 46
    review:
      material: LECTERN
      slot: 52

# The moderation list (/practice beddefense moderate): every defense,
# reported ones first.
beddefense-moderation:
  buttons:
    # Footer toggle: only defenses with open reports.
    reported:
      material: BELL
      slot: 46

# One defense's reports, opened from its actions.
beddefense-reports:
  buttons:
    # Footer: drop every report on it (two clicks).
    dismiss:
      material: LAVA_BUCKET
      slot: 52

# The in-arena menu behind the bed defense hotbar item while playing.
# The bed defense leaderboards list: three tiles per defense. The
# competitive tile wears the defense's own icon; the obsidian and bed
# repair tiles these.
beddefense-boards:
  obsidian-material: OBSIDIAN
  repair-material: TNT

beddefense-session:
  buttons:
    defense:
      slot: 13
    edit:
      material: WRITABLE_BOOK
      slot: 21
    guided:
      material: LEAD
      slot: 12
    # Only with more than one bed defense map to go to.
    maps:
      material: FILLED_MAP
      slot: 23
    new:
      material: CRAFTING_TABLE
      slot: 22
    preview:
      material: PAINTING
      slot: 11
    restart:
      material: CLOCK
      slot: 15
    # The round settings (the setup menu below), a red bed like the item.
    settings:
      material: RED_BED
      slot: 14
    # Row 3 — the four start buttons: one click switches the mode and
    # restarts the round in it. The mode you are set to glows.
    start-practice:
      material: LIME_DYE
      slot: 28
    start-competitive:
      material: NETHER_STAR
      slot: 30
    start-obsidian:
      material: OBSIDIAN
      slot: 32
    start-repair:
      material: TNT
      slot: 34
  rows: 5

# Bed defense practice. The category picker lists it as its own category
# (admin-made bed defense maps only) and every one of its menus is laid out here.
#
# The setup menu, opened by picking a map (and the round settings while
# playing): where you start, what you build, the editor, then one start
# button per mode.
beddefense:
  buttons:
    # Row 1 — the defense (icon follows the chosen one) and the timer start.
    defense:
      material: RED_BED
      slot: 12
    edit:
      material: WRITABLE_BOOK
      slot: 23
    # Row 2 — design your own: fresh, or one of yours.
    new:
      material: CRAFTING_TABLE
      slot: 21
    # Row 3 — go: one click picks the mode and starts the round. The mode
    # you are set to glows.
    start-practice:
      material: LIME_DYE
      slot: 28
    start-competitive:
      material: NETHER_STAR
      slot: 30
    start-obsidian:
      material: OBSIDIAN
      slot: 32
    start-repair:
      material: TNT
      slot: 34
    # Row 0 — the team base, only on maps with more than one. The icon is
    # always the team's own wool.
    team:
      slot: 4
    timer:
      material: REPEATER
      slot: 14
  # With categories off, the flat arena and leaderboard lists carry this
  # button instead of a category tile.
  flat-button:
    enabled: true
    material: RED_BED
    slot: 51
  rows: 5

# The glass pane border drawn around every menu.
filler:
  material: GRAY_STAINED_GLASS_PANE

# The per-objective board picker a rush arena opens from the leaderboards.
# One tile per objective; each icon defaults to the objective's own item.
rushboards:
  buttons:
    bed:
      slot: 10
    diamond:
      slot: 14
    emerald:
      slot: 12
    team_wipe:
      slot: 16
  rows: 3

pvpbot-kits:
  rows: 5
pvpbot-preview:
  back:
    slot: 0
  close:
    slot: 8
pvpbot:
  buttons:
    accuracy:
      material: TARGET
      slot: 21
    aggression:
      material: BLAZE_POWDER
      slot: 25
    block:
      material: SHIELD
      slot: 32
    bow:
      material: BOW
      slot: 30
    build:
      material: WHITE_WOOL
      slot: 33
    combos:
      material: RABBIT_FOOT
      slot: 23
    cps:
      material: SUGAR
      slot: 20
    evasiveness:
      material: FEATHER
      slot: 19
    gear:
      slot: 15
    kit:
      material: CHEST
      slot: 11
    preset:
      material: EXPERIENCE_BOTTLE
      slot: 13
    reach:
      material: STICK
      slot: 24
    rod:
      material: FISHING_ROD
      slot: 29
  rows: 5
rush:
  buttons:
    # The team button's icon always shows the selected team's wool.
    team:
      slot: 13
    start:
      slot: 39
      material: LIME_DYE
    # Row 2 — the six match modifiers.
    blocks:
      material: WHITE_WOOL
      slot: 20
    bot-armor:
      slot: 31
    bot-difficulty:
      material: EXPERIENCE_BOTTLE
      slot: 30
    bot-sword:
      slot: 32
    # Row 3 — defender bots at enemy bases. The three lineup buttons only
    # appear while the count is above zero; the armor and sword icons follow
    # the selected tier.
    bots:
      material: ZOMBIE_HEAD
      slot: 19
    # Instant ranked start: generators on, no starting items, defenses on.
    competitive:
      material: NETHER_STAR
      slot: 41
    currency:
      material: IRON_INGOT
      slot: 21
    # Opens the bed-defense gallery below; its icon follows the chosen preset.
    defense:
      slot: 23
    generators:
      material: FURNACE
      slot: 24
    pickaxe:
      material: IRON_PICKAXE
      slot: 22
    preset-bed-break:
      material: TNT
      slot: 49
    preset-bridge:
      material: SCAFFOLDING
      slot: 48
    preset-competitive-wipe:
      material: DIAMOND_SWORD
      slot: 47
    # The preset strip: each tile writes a known-good set of modifiers over
    # the player's dials and starts the run immediately. The two competitive
    # presets pin the ranked loadout; the rest are casual. A preset the
    # config has switched off (per-team 0, bots capped at none) never shows.
    preset-competitive:
      material: DIAMOND
      slot: 46
    preset-sandbox:
      material: CHEST
      slot: 52
    preset-skirmish:
      material: IRON_SWORD
      slot: 51
    preset-warmup:
      material: FEATHER
      slot: 50
    # Starter TNT — auto-ignites on place, like every rush TNT.
    tnt:
      material: TNT
      slot: 25
  rows: 6
rushshop:
  # An unfilled Quick Buy slot.
  quickbuy-empty: RED_STAINED_GLASS_PANE
  # The Quick Buy tab's icon.
  quickbuy:
    material: GOLD_BLOCK
  # The separator row: the plain pane, and the pane under the open tab.
  separator: GRAY_STAINED_GLASS_PANE
  separator-selected: LIME_STAINED_GLASS_PANE
